<!DOCTYPE html>
<html>
<head>
    <title>CORS测试</title>
</head>
<body>
    <h1>后端API CORS测试</h1>
    <button onclick="testAPI()">测试筛选配置API</button>
    <pre id="result"></pre>

    <script>
        async function testAPI() {
            const resultEl = document.getElementById('result');
            resultEl.textContent = '正在请求...';
            
            try {
                const response = await fetch('http://localhost:3001/api/v1/filters/config', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include'
                });
                
                const data = await response.json();
                resultEl.textContent = '✅ 成功！\n\n' + JSON.stringify(data, null, 2);
            } catch (error) {
                resultEl.textContent = '❌ 错误：' + error.message;
            }
        }
    </script>
</body>
</html>
