version: '3.8'

services:
  # Development backend with hot reload
  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    container_name: praxis-backend-dev
    command: pnpm dev
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/praxis
      JWT_SECRET: dev-secret-key-change-in-production
      JWT_EXPIRES_IN: 7d
      RATE_LIMIT_TTL: 60
      RATE_LIMIT_MAX: 100
      CORS_ORIGIN: http://localhost:3000,http://localhost:5173
      LOG_LEVEL: debug
    volumes:
      # Mount source code for hot reload
      - ./src:/app/src
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./nest-cli.json:/app/nest-cli.json
      - ./.env:/app/.env:ro
    depends_on:
      - postgres
      - redis
    networks:
      - praxis-network

  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: praxis-postgres-dev
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: praxis
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    networks:
      - praxis-network

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: praxis-redis-dev
    ports:
      - '6379:6379'
    networks:
      - praxis-network

networks:
  praxis-network:
    driver: bridge

volumes:
  postgres-dev-data:

